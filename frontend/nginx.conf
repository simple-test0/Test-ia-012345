server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dataset uploads can be large.
    client_max_body_size 4g;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing; the app shell itself must always be revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WebSocket to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;          # model loading / exports can be slow
        proxy_request_buffering off;      # stream uploads straight to the backend
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Long LLM answers / idle progress sockets must not be cut after 60s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
