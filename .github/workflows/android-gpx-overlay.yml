name: Android — Trace O (APK)

on:
  push:
    paths:
      - "gpx-overlay-android/**"
      - ".github/workflows/android-gpx-overlay.yml"
  pull_request:
    paths:
      - "gpx-overlay-android/**"
  workflow_dispatch:

# Écriture nécessaire uniquement pour publier la release (pas sur les pull requests).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpx-overlay-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      # Clé de signature privée (secrets du dépôt). Sans elle, l'APK est signé avec la clé
      # de développement publique : à configurer pour que personne d'autre ne puisse publier
      # une fausse mise à jour (voir le README).
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signature avec la clé privée du dépôt."
          else
            echo "::warning::Secret RELEASE_KEYSTORE_BASE64 absent : APK signé avec la clé de développement publique."
          fi

      - name: Compilation de l'APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk TraceO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TraceO-apk
          path: gpx-overlay-android/TraceO.apk

      # Lien de téléchargement direct (sans compte ni zip) :
      # https://github.com/<dépôt>/releases/download/traceo-latest/TraceO.apk
      - name: Publier l'APK (release « traceo-latest »)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: traceo-latest
          name: Trace O — dernière version
          prerelease: true
          overwrite_files: true
          files: gpx-overlay-android/TraceO.apk
          body: APK Android de Trace O, compilé automatiquement à chaque modification.
