name: Android — Trace O (APK)

on:
  push:
    paths:
      - "gpx-overlay-android/**"
      - ".github/workflows/android-gpx-overlay.yml"
  pull_request:
    paths:
      - "gpx-overlay-android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpx-overlay-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilation de l'APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk TraceO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TraceO-apk
          path: gpx-overlay-android/TraceO.apk

      # Lien de téléchargement direct (sans compte ni zip) :
      # https://github.com/<dépôt>/releases/download/traceo-latest/TraceO.apk
      - name: Publier l'APK (release « traceo-latest »)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: traceo-latest
          name: Trace O — dernière version
          prerelease: true
          overwrite_files: true
          files: gpx-overlay-android/TraceO.apk
          body: APK Android de Trace O, compilé automatiquement à chaque modification.
