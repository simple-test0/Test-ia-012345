services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - OLLAMA_BASE_URL=http://ollama:11434
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - API_TOKEN=${API_TOKEN:-}
      # The UI is served by the frontend container.
      - SERVE_FRONTEND=false
      # Keep the Hugging Face cache (LoRAs, datasets) across rebuilds.
      - HF_HOME=/data/hf-cache
    volumes:
      - ./data:/data
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # For GPU: install the NVIDIA Container Toolkit, build with
    # `docker compose build --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu121`
    # and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_TOKEN: ${API_TOKEN:-}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
